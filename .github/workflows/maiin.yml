name: Ubuntu-RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest # Launches on a clean Ubuntu Linux virtual machine
    timeout-minutes: 360   # Stays alive for up to 6 hours

    steps:
      - name: Install Desktop Environment and XRDP
        run: |
          sudo apt-get update
          # Install XFCE4 desktop environment and the XRDP server quietly
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp
          
          # Configure XRDP to use XFCE as its default graphical layout
          echo "xfce4-session" > ~/.xsession
          
          # Restart the service to apply the configuration
          sudo systemctl restart xrdp

      - name: Create RDP User with Secure Password
        run: |
          # Generate a random 16-character secure password using openssl
          PASSWORD=$(openssl rand -base64 12)
          
          # Create a standard user named 'rdpuser' and assign the password
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:$PASSWORD" | sudo chpasswd
          
          # Grant sudo/admin privileges to the new desktop user
          sudo usermod -aG sudo rdpuser
          
          # Save the password securely to the step pipeline environment
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Install and Connect Tailscale
        run: |
          # Download and run the official Tailscale installation script
          curl -fsSL https://tailscale.com | sh
          
          # Log in using your repository auth key secret and set a dynamic runner name
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-ubuntu-$GITHUB_RUN_ID
          
          # Fetch the assigned dynamic machine Tailscale IP address
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify XRDP Network Port binding
        run: |
          # Verify local loopback listening on RDP port 3389
          nc -zv 127.0.0.1 3389

      - name: Maintain Connection
        run: |
          Write_Logs() {
            echo ""
            echo "=== UBUNTU RDP ACCESS ==="
            echo "Address:  $TAILSCALE_IP"
            echo "Username: rdpuser"
            echo "Password: $RDP_PASSWORD"
            echo "========================="
            echo ""
          }
          Write_Logs
          
          # Keep runner active indefinitely (or until manually cancelled)
          while true; do
              echo "[$(date)] RDP Active - Cancel the job in GitHub to terminate session"
              sleep 300
          done
