name: Ubuntu-RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Ultra-Lightweight Openbox Desktop and XRDP
        run: |
          sudo apt-get update
          # Install Openbox, a minimal X11 server, and XRDP cleanly without desktop bloat
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openbox xorg xrdp
          
          # Configure XRDP to map directly to the Openbox window manager
          echo "openbox-session" > ~/.xsession
          
          sudo systemctl restart xrdp

      - name: Create RDP User with Secure Password
        run: |
          PASSWORD=$(openssl rand -base64 12)
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo rdpuser
          
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Securely Connect Tailscale Network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          # Fixed: Handled using a verified native context format to prevent dynamic string parsing failures
          args: --hostname=gh-ubuntu-${{ github.run_id }}

      - name: Capture Network Topology
        run: |
          # Fetch the assigned Tailscale IP from the configured interface adapter
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify Network Port Binding
        run: |
          nc -zv 127.0.0.1 3389

      - name: Maintain Connection
        run: |
          Write_Logs() {
            echo ""
            echo "=== UBUNTU RDP ACCESS ==="
            echo "Address:  $TAILSCALE_IP"
            echo "Username: rdpuser"
            echo "Password: $RDP_PASSWORD"
            echo "========================="
            echo ""
          }
          Write_Logs
          
          while true; do
              echo "[$(date)] RDP Active - Cancel the job in GitHub to terminate session"
              sleep 300
          done
